# Backend tests. Render (render.yaml) deploys server_py/ only after this passes.
name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "server_py/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "server_py/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_py
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server_py/requirements.txt

      - run: pip install -r requirements.txt pytest pytest-asyncio

      - run: python -m pytest -q
